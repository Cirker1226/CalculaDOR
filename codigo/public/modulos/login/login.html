<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalculaDor - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script defer src="login.js"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="card-login">
      <div class="logo">
          <img src="../../assets/images/logo.png" id="logo">
      </div>

      <div id="secao-login">
          <h4><i class="bi bi-shield-lock"></i> Autenticação</h4>
          <p class="subtitle">Entre com seu usuário ou e-mail.</p>

          <form id="login-form">
              <div class="campo">
                  <label>Usuário ou e-mail</label>
                  <div class="input-group-custom">
                      <i class="bi bi-person"></i>
                      <input type="text" id="username" placeholder="Digite seu usuário ou e-mail" required>
                  </div>
              </div>
              
              <div class="campo">
                  <label>Senha</label>
                  <div class="input-group-custom">
                      <i class="bi bi-key"></i>
                      <input type="password" id="password" placeholder="Digite sua senha" required>
                  </div>
              </div>

              <button type="submit" class="btn-login">Entrar</button>
              <button type="button" class="btn-cadastro" onclick="alternarTelas(true)">Cadastrar Usuário</button>
          </form>
      </div>

      <div id="secao-cadastro" class="d-none">

          <h4><i class="bi bi-person-plus"></i> Cadastro</h4>
          <p class="subtitle">Crie sua conta no sistema.</p>

          <form id="cadastro-form">
              <div class="campo">
                  <label>Nome completo</label>
                  <div class="input-group-custom">
                      <i class="bi bi-person"></i>
                      <input type="text" id="txt_nome" placeholder="Ex: João Silva" required>
                  </div>
              </div>

              <div class="campo">
                  <label>Usuário</label>
                  <div class="input-group-custom">
                      <i class="bi bi-at"></i>
                      <input type="text" id="txt_login" placeholder="Ex: joaosilva123" required>
                  </div>
              </div>

              <div class="campo">
                  <label>E-mail</label>
                  <div class="input-group-custom">
                      <i class="bi bi-envelope"></i>
                      <input type="email" id="txt_email" placeholder="exemplo@email.com" required>
                  </div>
              </div>

              <div class="campo linha-dupla">
                  <div class="campo-item">
                      <label>Senha</label>
                      <div class="input-group-custom">
                          <i class="bi bi-key"></i>
                          <input type="password" id="txt_senha" placeholder="Crie uma senha" required>
                      </div>
                  </div>

                  <div class="campo-item">
                      <label>Confirmar senha</label>
                      <div class="input-group-custom">
                          <i class="bi bi-key-fill"></i>
                          <input type="password" id="txt_senha2" placeholder="Repita a senha" required>
                      </div>
                  </div>
              </div>

              <button type="submit" class="btn-login">Cadastrar</button>
              <button type="button" class="btn-cadastro" onclick="alternarTelas(false)">Voltar para o Login</button>
          </form>
      </div>
  </div>
</body>
</html>
