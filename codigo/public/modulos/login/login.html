<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALCULADOR | Login Corporativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 2rem 0;
    }
    .custom-card {
      background: #ffffff;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .brand-title {
      color: #1e293b;
      font-weight: 700;
    }
    .brand-subtitle {
      color: #64748b;
      font-size: 0.9rem;
    }
    .form-label {
      color: #475569;
      font-weight: 500;
      font-size: 0.85rem;
    }
    .form-control {
      border-color: #cbd5e1;
      padding: 0.6rem 0.75rem;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    .btn-primary { background-color: #2563eb; border-color: #2563eb; }
    .btn-success { background-color: #059669; border-color: #059669; }
  </style>
</head>

<body>

  <div class="container">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-3 p-3 mb-3">
        <i class="bi bi-box-seam fs-3"></i>
      </div>
      <h2 class="brand-title mb-1">CALCULADOR</h2>
      <p class="brand-subtitle">Painel de Controle de Estoque e Fluxo de Caixa</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="custom-card p-4 p-sm-5">
          
          <div id="secao-login">
            <h4 class="brand-title mb-3 fs-5"><i class="bi bi-shield-lock me-2 text-primary"></i>Autenticação</h4>
            <p class="text-muted small mb-4">Entre com seu usuário ou email cadastrado.</p>
            
            <form id="login-form">
              <div class="mb-3">
                <label for="username" class="form-label text-uppercase">Usuário ou E-mail</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" id="username" class="form-control" placeholder="usuario ou email@..." required>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label text-uppercase mb-1">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary">Entrar no Dashboard</button>
              </div>

              <div class="text-center">
                <button type="button" class="btn btn-link btn-sm text-decoration-none text-muted" onclick="alternarTelas(true)">
                  <i class="bi bi-person-plus me-1 text-success"></i> Cadastrar Novo Usuário
                </button>
              </div>
            </form>
          </div>

          <div id="secao-cadastro" class="d-none">
            <h4 class="brand-title mb-3 fs-5"><i class="bi bi-person-plus me-2 text-success"></i>Cadastrar Usuário</h4>
            <p class="text-muted small mb-4">Preencha os campos para criar seu acesso ao sistema.</p>
            
            <form id="cadastro-form">
              <div class="mb-3">
                <label for="txt_nome" class="form-label">Nome Completo</label>
                <input type="text" id="txt_nome" class="form-control" placeholder="Ex: Lucas Ferdinando" required>
              </div>
              
              <div class="mb-3">
                <label for="txt_login" class="form-label">Nome de Usuário (Login)</label>
                <input type="text" id="txt_login" class="form-control" placeholder="Ex: lucasfer123" required>
              </div>

              <div class="mb-3">
                <label for="txt_email" class="form-label">E-mail</label>
                <input type="email" id="txt_email" class="form-control" placeholder="nome@empresa.com" required>
              </div>

              <div class="row g-2 mb-4">
                <div class="col-6">
                  <label for="txt_senha" class="form-label">Senha</label>
                  <input type="password" id="txt_senha" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="col-6">
                  <label for="txt_senha2" class="form-label">Confirmar</label>
                  <input type="password" id="txt_senha2" class="form-control" placeholder="••••••••" required>
                </div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">Salvar Registro</button>
                <button type="button" class="btn btn-light btn-sm text-muted" onclick="alternarTelas(false)">
                  Voltar para o Login
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/login.js"></script>
  
  <script>
    function alternarTelas(mostrarCadastro) {
      document.getElementById('secao-login').classList.toggle('d-none', mostrarCadastro);
      document.getElementById('secao-cadastro').classList.toggle('d-none', !mostrarCadastro);
    }

    document.getElementById('login-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      if (loginUser(user, pass)) {
        // Redirecionamento absoluto mapeado na raiz pública
        window.location.href = "/modulos/home/home.html"; 
      } else {
        alert('Usuário ou senha inválidos!');
      }
    });

    document.getElementById('cadastro-form').addEventListener('submit', function(event) {
      event.preventDefault();
      
      let nome = document.getElementById('txt_nome').value;
      let login = document.getElementById('txt_login').value;
      let email = document.getElementById('txt_email').value;
      let senha = document.getElementById('txt_senha').value;
      let senha2 = document.getElementById('txt_senha2').value;

      if (senha !== senha2) {
        alert('As senhas informadas não conferem.');
        return;
      }

      addUser(nome, login, email, senha);
    });
  </script>
</body>
</html>
