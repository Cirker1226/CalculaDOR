<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalculaDOR - Despesas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/style_menu.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="../../assets/js/menu.js"></script>
</head>
<body>
    <main class="conteudo">
        <nav class="menu-lateral">
            <div class="logo">
                <img src="../../assets/images/logo.png" alt="logo calculaDOR">
            </div>

            <div class="opcoes">
                <ul>
                    <a href="../home/home.html"><li><i class="bi bi-house"></i> Dashboard</li></a>
                    <a href="../clientes/index.html"><li><i class="bi bi-people"></i> Clientes</li></a>
                    <a href="../vendas/vendas.html"><li><i class="bi bi-cart4"></i> Vendas</li></a>
                    <a href="../Lucas-sprint2/index.html"><li><i class="bi bi-box"></i> Estoque</li></a>
                    <a href="../gustavo-sprint2/index.html"><li class="ativo"><i class="bi bi-cash-stack"></i> Financeiro</li></a>
                    <a href="../relatorio/relatorio.html"><li><i class="bi bi-bar-chart"></i> Relatórios</li></a>
                    <a href="../Lucas/index.html"><li><i class="bi bi-truck"></i> Fornecedor</li></a>
                    <a href="../Matheus-sprint2/calendario.html"><li><i class="bi bi-calendar3"></i> Calendário</li></a>
                </ul>
            </div>

            <div class="menu-baixo">
                <div class="perfil">
                    <img src="../../assets/images/perfil.png" alt="foto de perfil">
                    <div class="perfil-txt">
                        <p id="nome-usuario">Usuário</p>
                        <span>Administrador</span>
                    </div>
                </div>
                <div class="config">
                    <img id="config" src="../../assets/images/config.png" alt="configurações">
                </div>
            </div>
        </nav>

        <section class="despesas-home">
            <div class="container-fluid p-4" style="overflow-y: auto;">

                <div class="bg-white p-4 rounded shadow-sm border">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <h6 class="text-uppercase fw-bold mb-0" style="color: #29af17; letter-spacing: 1px;">
                            Lista de Despesas
                        </h6>

                        <div class="d-flex gap-3">
                            <div class="bg-primary bg-opacity-10 px-3 py-2 rounded border border-primary border-opacity-25 shadow-sm">
                                <span class="text-primary fw-bold" style="font-size: 0.95rem;" id="qtd-total-despesas">
                                    Qtd: 0
                                </span>
                            </div>

                            <div class="bg-success bg-opacity-10 px-3 py-2 rounded border border-success border-opacity-25 shadow-sm">
                                <span class="text-success fw-bold" style="font-size: 0.95rem;" id="valor-total-despesas">
                                    Total: R$ 0,00
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <a href="../gustavo/index.html" class="btn btn-success btn-sm px-3 py-2 rounded-1 shadow-sm">
                            <i class="bi bi-plus-circle me-1"></i> Criar Nova
                        </a>

                        <div class="input-group input-group-sm w-25 shadow-sm" style="min-width: 200px;">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="busca-despesa" placeholder="Buscar despesa..." onkeyup="filtrarDespesas()">
                        </div>

                        <div class="btn-group border rounded-1 p-0 shadow-sm" role="group">
                            <button type="button" class="btn btn-light btn-sm text-secondary px-3" onclick="carregarDespesas('barato')">Menor Preço</button>
                            <button type="button" class="btn btn-light btn-sm text-secondary px-3" onclick="carregarDespesas('caro')">Maior Preço</button>
                            <button type="button" class="btn btn-light btn-sm text-secondary px-3" onclick="carregarDespesas('recente')">Mais Recentes</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-sm table-borderless table-hover align-middle text-secondary mb-0">
                            <thead style="border-bottom: 2px solid #f1f5f9; color: #1e293b;">
                                <tr>
                                    <th scope="col" class="py-2">#ID</th>
                                    <th scope="col" class="py-2">Nome</th>
                                    <th scope="col" class="py-2">Valor</th>
                                    <th scope="col" class="py-2">Data</th>
                                    <th scope="col" class="py-2">Tipo</th>
                                    <th scope="col" class="py-2">Observações</th>
                                    <th scope="col" class="py-2 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-tabela">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
    <script src="app.js"></script>
</body>
</html>
