<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suas despesas</title>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <main class="conteudo">
        <nav class="menu-lateral">
            <div class="logo">
                <img src="img/logo2.png" alt="logo calculaDOR">
            </div>

            <div class="opcoes">
                <ul>
                    <a href="#">
                        <li>Home</li>
                    </a>
                    <a href="#">
                        <li>Calendário</li>
                    </a>
                    <a href="#">
                        <li>Financeiro</li>
                    </a>
                    <a href="#">
                        <li>Estoque</li>
                    </a>
                    <a href="#">
                        <li>Relatorios</li>
                    </a>
                    <a href="#">
                        <li>CRM</li>
                    </a>
                </ul>
            </div>

            <div class="menu-baixo">
                <div class="perfil">
                    <img src="img/perfil.png" alt="foto de perfil">
                    <div class="perfil-txt">
                        <p>Marçal</p>
                        <span>Adiministrador</span>
                    </div>
                </div>
                <div class="config">
                    <img id="config" src="img/config.png" alt="configurações">
                </div>
            </div>
        </nav>


        <div class="container-fluid p-4" style="background-color: #eaf4fc; width: 100%;">

            <div class="bg-white p-4 rounded shadow-sm">

                <h6 class="text-uppercase fw-bold mb-4" style="color: #0d6efd; letter-spacing: 1px;">
                    Lista de Despesas
                </h6>

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <a href="/plf-es-2026-1-ti1-7620100-getech-1/codigo/public/modulos/gustavo/index.html"
                        class="btn btn-primary btn-sm px-4 py-2 rounded-1">
                        + Criar Nova
                    </a>

                    <div class="btn-group border rounded-1 p-1" role="group">
                        <button type="button" class="btn btn-light btn-sm text-secondary"
                            onclick="carregarDespesas('barato')">Menor Preço</button>
                        <button type="button" class="btn btn-light btn-sm text-secondary"
                            onclick="carregarDespesas('caro')">Maior Preço</button>
                        <button type="button" class="btn btn-light btn-sm text-secondary"
                            onclick="carregarDespesas('recente')">Mais Recentes</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-borderless table-striped align-middle text-secondary">
                        <thead style="border-bottom: 2px solid #f1f5f9; color: #1e293b;">
                            <tr>
                                <th scope="col" class="py-3">#ID</th>
                                <th scope="col" class="py-3">Nome</th>
                                <th scope="col" class="py-3">Valor</th>
                                <th scope="col" class="py-3">Data</th>
                                <th scope="col" class="py-3">Tipo</th>
                                <th scope="col" class="py-3">Observações</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela">
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>


</body>

</html>
