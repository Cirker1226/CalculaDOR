<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Cadastro de despesas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body onload="init()">
    <h1>Cadastro de despesas</h1>

    <div class="container">
      <div class="row">
        <div id="msg" class="col-sm-10 offset-sm-1"></div>
      </div>

      <form id="form-despesa">
        <div class="form-group row">
          <div class="col-sm-4">
            <label for="inputId">Id</label>
            <input
              type="text"
              class="form-control"
              id="inputId"
              placeholder="ID"
              disabled
            />
          </div>
          <div class="col-sm-8">
            <label for="inputNomeDaDespesa">Nome da Despesa (*)</label>
            <input
              type="text"
              class="form-control"
              id="inputNomeDaDespesa"
              required
              placeholder="Informe o nome da despesa"
            />
          </div>
        </div>
        <div class="form-group row">
          <div class="col-sm-5">
            <label for="inputValorDaDespesa">Valor da despesa(*)</label>
            <input
              type="number"
              class="form-control"
              id="inputValorDaDespesa"
              required
              placeholder="Valor"
            />
          </div>
          <div class="col-sm-7">
            <label for="inputData">Data (*)</label>
            <input
              type="date"
              class="form-control"
              id="inputData"
              required
              placeholder="Data"
            />
          </div>
        </div>
        <div class="form-group row">
          <div class="col-sm-12">
            <label for="inputObs">Observações</label>
            <textarea
              type="text"
              class="form-control"
              id="inputObs"
              required
              placeholder="Informe alguma observação adicional para sua despesa"
            ></textarea>
          </div>
        </div>
        <div class="form-group row">
          <div class="col-sm-12">
            <label>Tipo da despesa (*)</label>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="tipoDespesa"
                id="tipoFornecedor"
                value="Fornecedor"
                checked
              />
              <label class="form-check-label" for="tipoFornecedor"
                >Fornecedor</label
              >
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="tipoDespesa"
                id="tipoFuncionario"
                value="Funcionario"
              />
              <label class="form-check-label" for="tipoFuncionario"
                >Funcionário</label
              >
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="tipoDespesa"
                id="tipoAluguel"
                value="Aluguel"
              />
              <label class="form-check-label" for="tipoAluguel">Aluguel</label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="tipoDespesa"
                id="tipoOutros"
                value="Outros"
              />
              <label class="form-check-label" for="tipoOutros">Outros</label>
            </div>
          </div>
        </div>

        <div class="form-group row">
          <div class="col-sm-4">
            <small>(*) Campos obrigatórios</small>
          </div>
        </div>


        <div class="form-group row">
          <div class="col-sm-12">
            <input
              type="button"
              class="btn btn-success"
              id="btnInsert"
              value="Inserir"
            />
            <input
              type="button"
              class="btn btn-warning"
              id="btnUpdate"
              value="Alterar"
            />
            <input
              type="button"
              class="btn btn-danger"
              id="btnDelete"
              value="Excluir"
            />
            <input
              type="button"
              class="btn btn-secondary"
              id="btnClear"
              value="Limpar Form"
            />
            <a href="search.html"
              ><input
                type="button"
                class="btn btn-warning"
                id="btnClear"
                value="Pesquisar Despesa"
            /></a>
          </div>
        </div>
      </form>

      <div class="row">
        <div class="col-sm-12">
          <table id="grid-despesas" class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Despesa</th>
                <th scope="col">Valor da despesa</th>
                <th scope="col">Para</th>
                <th scope="col">Tipo</th>
              </tr>
            </thead>
            <tbody id="table-despesas">
              <tr>
                <td scope="row">1</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="apps.js"></script>
    <script>
    
    function exibeDespesas() {
        
        const tableDespesas = document.getElementById("table-despesas");
        tableDespesas.innerHTML = "";

        
        readDespesa((dados) => {
            dados.forEach(despesa => {
                tableDespesas.innerHTML += `
                    <tr>
                        <td scope="row">${despesa.id}</td>
                        <td>${despesa.nome}</td>
                        <td>R$ ${despesa.valor}</td>
                        <td>${despesa.data}</td>
                        <td>${despesa.tipo}</td>
                    </tr>`;
            });
        });
    }

    function init() {
        const formDespesa = document.getElementById("form-despesa");

        
        document.getElementById("btnInsert").addEventListener("click", function () {
            if (!formDespesa.checkValidity()) {
                displayMessage("Preencha o formulário corretamente.");
                return;
            }

            
            const tipoSelecionado = document.querySelector('input[name="tipoDespesa"]:checked').value;

            let despesa = {
                nome: document.getElementById("inputNomeDaDespesa").value,
                valor: document.getElementById("inputValorDaDespesa").value,
                data: document.getElementById("inputData").value,
                obs: document.getElementById("inputObs").value,
                tipo: tipoSelecionado 
            };

            createDespesa(despesa, exibeDespesas);
            formDespesa.reset();
        });

        // --- BOTÃO ALTERAR ---
        document.getElementById("btnUpdate").addEventListener("click", function () {
            let campoId = document.getElementById("inputId").value;
            if (campoId == "") {
                displayMessage("Selecione uma despesa na tabela primeiro.");
                return;
            }

            const tipoSelecionado = document.querySelector('input[name="tipoDespesa"]:checked').value;

            let despesa = {
                nome: document.getElementById("inputNomeDaDespesa").value,
                valor: document.getElementById("inputValorDaDespesa").value,
                data: document.getElementById("inputData").value,
                obs: document.getElementById("inputObs").value,
                tipo: tipoSelecionado
            };

            updateDespesa(campoId, despesa, exibeDespesas);
            formDespesa.reset();
        });

        
        document.getElementById("btnDelete").addEventListener("click", function () {
            let campoId = document.getElementById("inputId").value;
            if (campoId == "") {
                displayMessage("Selecione uma despesa para excluir.");
                return;
            }
            deleteDespesa(campoId, exibeDespesas);
            formDespesa.reset();
        });

        
        document.getElementById("btnClear").addEventListener("click", () => formDespesa.reset());

        
        document.getElementById("grid-despesas").addEventListener("click", function (e) {
            if (e.target.tagName == "TD") {
                let colunas = e.target.parentNode.querySelectorAll("td");

                document.getElementById("inputId").value = colunas[0].innerText;
                document.getElementById("inputNomeDaDespesa").value = colunas[1].innerText;
                document.getElementById("inputValorDaDespesa").value = colunas[2].innerText.replace('R$ ', '');
                document.getElementById("inputData").value = colunas[3].innerText;
                
                const tipoNaTabela = colunas[4].innerText;
                const radio = document.querySelector(`input[value="${tipoNaTabela}"]`);
                if (radio) radio.checked = true;
            }
        });

        exibeDespesas();
    }
</script>
  </body>
</html>
