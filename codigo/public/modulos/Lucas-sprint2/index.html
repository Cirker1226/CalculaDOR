<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Estratégica de Estoque - Análise de Giro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-metric { transition: transform 0.2s; }
        .card-metric:hover { transform: translateY(-3px); }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid px-4 py-4">
    <div class="bg-white p-4 shadow-sm rounded-4">
        <h2 class="mb-4 fw-bold text-dark">
            Análise de Giro e Produtos Parados
        </h2>
        
        <div class="row g-3 mb-4 align-items-end">
            <div class="col-12 col-md-4">
                <label class="form-label fw-semibold text-secondary">Período sem Movimentação</label>
                <select id="filtro-periodo" class="form-select">
                    <option value="todos">Todos (Sempre)</option>
                    <option value="7">Últimos 7 dias</option>
                    <option value="30">Últimos 30 dias</option>
                    <option value="90">Últimos 90 dias</option>
                    <option value="custom">Personalizado (Mais de 90 dias)</option>
                </select>
            </div>
            <div class="col-12 col-md-5">
                <label class="form-label fw-semibold text-secondary">Pesquisar</label>
                <input type="text" id="input-busca" class="form-control" placeholder="Buscar por Nome ou SKU...">
            </div>
            <div class="col-12 col-md-3">
                <button class="btn btn-primary w-100 fw-bold" onclick="aplicarFiltros()">
                    <i class="fa-solid fa-filter me-1"></i> Filtrar Dados
                </button>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-metric bg-light border-0 shadow-sm p-3">
                    <div class="text-secondary small fw-bold text-uppercase">Total de Produtos</div>
                    <div id="metric-total-produtos" class="fs-3 fw-bold text-dark">0</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-metric bg-light border-0 shadow-sm p-3">
                    <div class="text-secondary small fw-bold text-uppercase text-danger">Colocar em Promoção (>30d)</div>
                    <div id="metric-produtos-promocao" class="fs-3 fw-bold text-danger">0 itens</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-metric bg-light border-0 shadow-sm p-3">
                    <div class="text-secondary small fw-bold text-uppercase">Média Dias Sem Movimentação</div>
                    <div id="metric-media-dias" class="fs-3 fw-bold text-warning">0 dias</div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-metric bg-light border-0 shadow-sm p-3">
                    <div class="text-secondary small fw-bold text-uppercase text-success">Produto que Mais Sai</div>
                    <div id="metric-mais-vendido" class="fs-5 fw-bold text-success text-truncate" style="max-width: 100%;">Nenhum</div>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle border border-light-subtle">
                <thead class="table-light">
                    <tr>
                        <th>Produto</th>
                        <th>SKU</th>
                        <th>Categoria</th>
                        <th>Quantidade Movimentada</th>
                        <th>Última Movimentação</th>
                        <th>Dias sem Movimentação</th>
                        <th class="text-end">Valor Total Parado</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
