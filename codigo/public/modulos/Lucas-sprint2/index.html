<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Estratégica de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container bg-white p-4 mt-4 shadow-sm rounded">
    <h2 class="text-center mb-4 fw-bold">Análise de Giro de Estoque</h2>
    
    <div class="d-flex justify-content-center gap-2 mb-3">
        <button class="btn btn-outline-primary" onclick="resetarFiltros()">Todos</button>
        <button class="btn btn-success" onclick="ordenarProdutos('mais')"><i class="fa-solid fa-arrow-up"></i> Mais Movimentados</button>
        <button class="btn btn-danger" onclick="ordenarProdutos('menos')"><i class="fa-solid fa-arrow-down"></i> Menos Movimentados</button>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-4">
        <button class="btn btn-outline-success btn-sm" onclick="sugerirCompras()"><i class="fa-solid fa-cart-plus"></i> Sugestão de Compras</button>
        <button class="btn btn-outline-danger btn-sm" onclick="gerarListaPromocao()"><i class="fa-solid fa-tags"></i> Lista de Promoção</button>
        <button class="btn btn-outline-dark btn-sm" onclick="acaoEmLote()"><i class="fa-solid fa-check-double"></i> Relatório Selecionados</button>
    </div>

    <div class="mb-4">
        <input type="text" id="input-busca" class="form-control" placeholder="🔍 Pesquisar produto..." onkeyup="filtrarPorBusca(this.value)">
    </div>

    <div class="table-responsive mb-4">
        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th><input type="checkbox" id="selecionar-todos" onclick="alternarTodos(this)"></th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Nível de Movimentação</th>
                    <th>Qtde Movimentada</th>
                    <th>Última movimentação</th>
                    <th>Dias parado</th>
                    <th>Valor total parado (R$)</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
        </table>
    </div>

    <div class="row text-center mb-4">
        <div class="col border p-3 bg-light">Total (Médio/Baixo)<br><strong id="total-produtos">0</strong></div>
        <div class="col border p-3 bg-light">Valor Total Parado<br><strong id="total-valor">R$ 0,00</strong></div>
        <div class="col border p-3 bg-light">Capital Imobilizado<br><strong id="capital-imobilizado">R$ 0,00</strong></div>
        <div class="col border p-3 bg-light">Ticket Médio (Parado)<br><strong id="ticket-medio">R$ 0,00</strong></div>
    </div>
</div>

<div class="modal fade" id="modalGestao" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="tituloModal"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="conteudoModal"></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
