<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalculaDOR - Produtos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="conteudo">
        <nav class="menu-lateral">
            <div class="logo">
                <img src="img/logo2.png" alt="logo calculaDOR">
            </div>

            <div class="opcoes">
                <ul>
                    <a href="#"><li>Home</li></a>
                    <a href="#"><li>Calendário</li></a>
                    <a href="#"><li>Financeiro</li></a>
                    <a href="#"><li>Estoque</li></a>
                    <a href="#"><li>Relatorios</li></a>
                    <a href="#"><li>CRM</li></a>
                </ul>
            </div>

            <div class="menu-baixo">
                <div class="perfil">
                    <img src="img/perfil.png" alt="foto de perfil">
                    <div class="perfil-txt">
                        <p>Marçal</p>
                        <span>Adiministrador</span>
                    </div>
                </div>
                <div class="config">
                    <img id="config" src="img/config.png" alt="configurações">
                </div>
            </div>
        </nav>

        <main class="calendario-home">
            <div class="menu-cima">
                <div class="menu-cima-text">
                    <h1>Calendário Corporativo</h1>
                    <p>Visualize e gerencie os eventos do seu calendário</p>
                </div>

                <div class="botao">
                    <button type="button" class="btn btn-light " data-bs-toggle="modal" data-bs-target="#meuModal" onclick="abrirModal()"><i class="bi bi-calendar-plus"></i> Novo Evento</button>
                </div>
            </div>

            <div class="calendario">
                <div id='calendar'></div>
            </div>
        </main>

        <div class="modal fade" id="meuModal" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Cadastrar Evento</h5>
                </div>

                <div class="modal-body">
                    <form id="formEvento">
                        <div class="mb-3">
                            <label for="tituloEvento" class="form-label">Título do Evento</label>
                            <input type="text" class="form-control" id="tituloEvento" placeholder="Digite o título do evento" required>
                        </div>

                        <div class="mb-3">
                            <label for="dataInicio" class="form-label">Data Inicial</label>
                            <input type="date" class="form-control" id="dataInicio" required>
                        </div>

                        <div class="mb-3">
                            <label for="dataFim" class="form-label">Data Final</label>
                            <input type="date" class="form-control" id="dataFim" required>
                        </div>

                        <div class="mb-3">
                            <label for="corEvento" class="form-label">Cor</label>
                            <input type="color" class="form-control form-control-color" id="corEvento" value="#0d6efd">
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button id="btnSalvarEvento" type="button" class="btn btn-primary" data-bs-dismiss="modal">Salvar Evento</button>
                </div>
            </div>
        </div>
    </main>
</body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
    <script src="calendario.js"></script>
</html>
